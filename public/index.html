<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TENSEI.EXE</title>
<meta name="description" content="TENSEI.EXE is an original cyberpunk universe by SujiPop: the lore, the NFT collection, the animated series.">
<meta name="theme-color" content="#14081f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&family=Hanken+Grotesk:wght@400;600;800&family=Noto+Sans+JP:wght@900&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Hanken+Grotesk:wght@400;600;800&family=Noto+Sans+JP:wght@900&display=swap"></noscript>
<style>
:root{
  --ink:#14081f; --ink2:#241238; --pink:#ff6de0; --purple:#c66eff; --mint:#6effdb; --yellow:#ffe76e; --white:#fffaf0;
  --hh:62px;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --jp:"Noto Sans JP","Hiragino Sans","Yu Gothic","Noto Sans CJK JP",sans-serif;
  --cham:14px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--white);font:400 1rem/1.5 var(--body);overflow-x:hidden}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
.top{position:fixed;inset:0 0 auto 0;height:var(--hh);z-index:60;background:var(--ink);border-bottom:3px solid var(--yellow);display:flex;align-items:center;gap:14px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.brand{font:700 1.45rem/1 var(--display);letter-spacing:.04em;text-decoration:none;color:var(--white);white-space:nowrap}
.brand b{color:var(--pink);font-weight:700}
.nav{margin-left:auto;display:flex;gap:6px}
.nav a{font:600 .95rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;padding:11px 14px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));color:var(--white)}
.nav a:hover{background:var(--ink2)}
.nav a.on{background:var(--yellow);color:var(--ink)}
.minthd{font:700 .9rem/1 var(--display);letter-spacing:.12em;text-decoration:none;background:var(--pink);color:var(--ink);padding:12px 16px;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));white-space:nowrap}
.minthd:hover{background:var(--mint)}
main{padding-top:var(--hh);min-height:100svh}

/* ---------- shared bits ---------- */
.btn{display:inline-flex;align-items:center;gap:.6em;font:700 1rem/1 var(--display);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:16px 24px;background:var(--yellow);color:var(--ink);border:0;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:transform .15s,background .15s}
.btn:hover{background:var(--mint);transform:translateY(-2px)}
.btn.pink{background:var(--pink)} .btn.pink:hover{background:var(--yellow)}
.btn.ghost{background:transparent;color:var(--white);box-shadow:inset 0 0 0 3px var(--white);clip-path:none}
.btn.ghost:hover{background:var(--white);color:var(--ink)}
.tag{display:inline-block;font:600 .75rem/1 var(--display);letter-spacing:.2em;text-transform:uppercase;padding:7px 10px;background:var(--ink);color:var(--yellow)}
.grid-bg{background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:44px 44px}
.hazard{height:14px;background:repeating-linear-gradient(135deg,var(--ink) 0 12px,var(--yellow) 12px 24px)}
.h2{font:700 clamp(2.2rem,7vw,5rem)/.95 var(--display);text-transform:uppercase;letter-spacing:.01em}
.jp{font-family:var(--jp);font-weight:900}
@keyframes gl{0%,86%,100%{text-shadow:none;transform:none}88%{text-shadow:4px 0 var(--pink),-4px 0 var(--mint);transform:translateX(2px)}90%{text-shadow:-5px 0 var(--pink),5px 0 var(--mint);transform:translateX(-2px)}92%{text-shadow:3px 0 var(--mint),-3px 0 var(--pink);transform:none}}
.glitch{animation:gl 4s steps(1) infinite}

/* ---------- lore (scroll story) ---------- */
.scene{position:relative;height:var(--h,320vh);--p:0}
.stick{position:sticky;top:var(--hh);height:calc(100svh - var(--hh));overflow:hidden;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:2vw;padding:0 6vw}
.scene .vis{position:relative;height:100%;display:grid;place-items:center;grid-column:2;grid-row:1}
.scene .txt{grid-column:1;grid-row:1;position:relative;z-index:3;align-self:center}
.s-ink{background:var(--ink);color:var(--white)}
.s-purple{background:var(--purple);color:var(--ink)}
.s-yellow{background:var(--yellow);color:var(--ink)}
.s-mint{background:var(--mint);color:var(--ink)}
.s-pink{background:var(--pink);color:var(--ink)}
.lines{display:grid}
.ln{grid-area:1/1;font:700 clamp(2.1rem,5.6vw,5rem)/1.02 var(--display);text-transform:uppercase;letter-spacing:.005em;opacity:0;transform:translateY(34px);transition:opacity .45s,transform .55s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.ln.on{opacity:1;transform:none}
.ln.done{opacity:0;transform:translateY(-34px)}
.ln em{font-style:normal;background:var(--ink);color:var(--yellow);padding:0 .12em}
.s-ink .ln em{background:var(--pink);color:var(--ink)}
.ch{font:600 .8rem/1 var(--display);letter-spacing:.3em;text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.ch::before{content:"";width:34px;height:10px;background:repeating-linear-gradient(135deg,currentColor 0 5px,transparent 5px 10px)}
.stars i{position:absolute;background:var(--white);width:3px;height:3px;animation:tw 2.4s steps(2) infinite}
@keyframes tw{50%{opacity:.15}}
.rail{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:10px}
.rail button{width:12px;height:12px;border:2px solid var(--white);background:var(--ink);padding:0;transition:.2s}
.rail button.on{background:var(--yellow);border-color:var(--ink);transform:scale(1.35) rotate(45deg)}

/* hero */
.hero .stick{grid-template-columns:1fr;padding:0;text-align:center;place-items:center}
.hero .stick{background:var(--ink)}
.hero-in{position:relative;z-index:2;transform:translateY(calc(var(--p) * -90px)) scale(calc(1 - var(--p) * .25));opacity:clamp(0,calc(1.5 - var(--p) * 1.7),1)}
.hero h1{font:700 clamp(3.6rem,19vw,15rem)/.85 var(--display);letter-spacing:-.01em;color:var(--white)}
.hero h1 span{color:var(--pink);display:block;font-size:.5em;letter-spacing:.14em;margin-top:.12em}
.hero .sub{margin-top:26px;font:600 clamp(.85rem,2.6vw,1.3rem)/1.3 var(--display);letter-spacing:.34em;text-transform:uppercase;color:var(--yellow)}
.hero .big-jp{position:absolute;right:5vw;top:6vh;writing-mode:vertical-rl;font-size:clamp(3rem,11vw,9rem);line-height:1;color:var(--purple);z-index:1;transform:translateY(calc(var(--p) * 160px))}
.hero .hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:calc(60% + var(--p) * 30%) 50%;z-index:0;background:var(--ink)}
.hero.hasvid .ring,.hero.hasvid .big-jp,.hero.hasvid .stars{display:none}
.hero.hasvid .stick{place-items:center start;text-align:left}
.hero.hasvid .hero-in{padding-left:clamp(22px,6vw,90px);opacity:clamp(0,calc(1.7 - var(--p) * 2.6),1);transform:translateY(calc(var(--p) * -60px))}
.hero.hasvid h1,.hero.hasvid .sub{text-shadow:5px 5px 0 var(--ink)}
.hero.hasvid h1{font-size:clamp(3.2rem,13vw,11rem)}
.hero.hasvid .sub{background:var(--ink);display:inline-block;padding:9px 12px;text-shadow:none}


/* story videos (The Beam, SujiCorp): full-bleed, scrubbed by scroll, text on ink plates */
.vscene .stick{grid-template-columns:1fr;padding:0;display:block;background:var(--ink)}
.vscene .sv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;background:var(--ink)}
.vscene .txt{position:absolute;left:clamp(26px,4vw,52px);bottom:clamp(34px,6vh,58px);max-width:min(860px,82vw);z-index:3}
.vscene .ch{display:inline-flex;background:var(--yellow);color:var(--ink);padding:6px 10px;margin-bottom:0;font-size:.6rem;letter-spacing:.24em}
.vscene .ch::before{display:none}
.vscene .lines{background:var(--ink);padding:11px 18px 12px;border-left:5px solid var(--pink);margin-top:0}
.vscene .ln{font-size:clamp(1.05rem,1.9vw,1.75rem);line-height:1.1;letter-spacing:.04em}
.vscene .vhud{position:absolute;inset:clamp(12px,2.4vw,28px);pointer-events:none;z-index:3}
.vscene .vhud i{position:absolute;width:clamp(22px,3vw,40px);height:clamp(22px,3vw,40px);border:0 solid var(--mint)}
.vscene .vhud i:nth-child(1){left:0;top:0;border-width:3px 0 0 3px}.vscene .vhud i:nth-child(2){right:0;top:0;border-width:3px 3px 0 0}
.vscene .vhud i:nth-child(3){left:0;bottom:0;border-width:0 0 3px 3px}.vscene .vhud i:nth-child(4){right:0;bottom:0;border-width:0 3px 3px 0}
.vscene .vtime{position:absolute;left:clamp(26px,4vw,52px);top:clamp(24px,3.4vw,44px);z-index:3;background:var(--ink);color:var(--yellow);font:600 .72rem/1 var(--display);letter-spacing:.2em;padding:8px 10px}
.vscene .vbar{position:absolute;left:clamp(26px,4vw,52px);right:clamp(26px,4vw,52px);bottom:clamp(14px,2.6vw,30px);height:4px;background:rgba(20,8,31,.7);z-index:3}
.vscene .vbar span{display:block;height:100%;width:calc(var(--p) * 100%);background:var(--mint)}
@media (max-width:700px){
  .vscene .sv{inset:0 0 auto 0;height:56svh;border-bottom:3px solid var(--mint)}
  .vscene .txt{left:0;right:0;bottom:auto;top:calc(56svh + 14px);padding:0 18px;max-width:none}
  .vscene .lines{padding:14px 16px 16px}
  .vscene .ln{font-size:clamp(1.4rem,7vw,2.1rem)}
  .vscene .vtime{font-size:.62rem;padding:6px 8px;top:24px;left:26px}
}

/* hero video: HUD treatment (flat colours only) */
.hero .hv{object-position:68% 50%}
.hero.hasvid .strip{display:none}
.hero.vdone .cue{opacity:1}
.hero.hasvid .hero-in{position:absolute;left:0;top:50%;padding-left:clamp(26px,6vw,90px);max-width:min(620px,92vw);transform:translateY(calc(-50% - var(--p) * 60px));opacity:clamp(0,calc(1.7 - var(--p) * 4.2),1)}
.hero.hasvid .htag{display:inline-block;background:var(--yellow);color:var(--ink);font:700 .78rem/1 var(--display);letter-spacing:.24em;padding:8px 12px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);text-transform:uppercase}
.hero.hasvid h1{margin-top:14px;font-size:clamp(3.2rem,11vw,9.2rem);line-height:.84;text-transform:uppercase;text-shadow:4px 4px 0 var(--ink)}
.hero.hasvid h1 span{font-size:.46em;letter-spacing:.16em;margin-top:.14em;text-shadow:3px 3px 0 var(--ink)}
.hero.hasvid .sub{margin-top:20px;background:var(--ink);color:var(--mint);font-size:clamp(.78rem,1.8vw,1.05rem);letter-spacing:.3em;padding:10px 14px;border-left:4px solid var(--pink)}
.hero.hasvid .cue{background:var(--ink);color:var(--yellow);padding:9px 12px;bottom:clamp(22px,4vh,40px);font-size:.72rem;letter-spacing:.34em}
.hero .hud{position:absolute;inset:clamp(12px,2.4vw,28px);pointer-events:none;z-index:3}
.hero .hud i{position:absolute;width:clamp(22px,3vw,40px);height:clamp(22px,3vw,40px);border:0 solid var(--mint)}
.hero .hud i:nth-child(1){left:0;top:0;border-width:3px 0 0 3px}.hero .hud i:nth-child(2){right:0;top:0;border-width:3px 3px 0 0}
.hero .hud i:nth-child(3){left:0;bottom:0;border-width:0 0 3px 3px}.hero .hud i:nth-child(4){right:0;bottom:0;border-width:0 3px 3px 0}
.hero .tick,.hero .rec{position:absolute;top:clamp(24px,3.4vw,44px);z-index:3;background:var(--ink);font:600 .72rem/1 var(--display);letter-spacing:.2em;padding:8px 10px}
.hero .tick{left:clamp(26px,4vw,52px);color:var(--yellow)}
.hero .rec{right:clamp(26px,4vw,52px);display:flex;gap:10px;align-items:center;color:var(--mint)}
.hero .rec b{width:9px;height:9px;background:var(--pink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hero .kanji{position:absolute;right:clamp(26px,4vw,52px);top:clamp(70px,9vh,110px);z-index:2;writing-mode:vertical-rl;font-size:clamp(2rem,5vw,4.2rem);line-height:1;color:var(--purple);text-shadow:3px 3px 0 var(--ink);opacity:clamp(0,calc(1.7 - var(--p) * 4.2),1)}
.hero .plates{position:absolute;right:clamp(26px,5vw,80px);bottom:clamp(70px,13vh,150px);z-index:3;display:grid;gap:10px;justify-items:end;opacity:clamp(0,calc((var(--p) - .7) * 6),1)}
.hero .plate{display:flex;gap:10px;align-items:center;background:var(--ink);padding:9px 14px 9px 10px;font:700 clamp(.8rem,1.6vw,1.1rem)/1 var(--display);letter-spacing:.18em;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px)}
.hero .plate b{width:12px;height:12px;display:block}.hero .plate.l b{background:var(--pink)}.hero .plate.r b{background:var(--yellow)}
.hero .plate small{font:500 .62rem/1 var(--display);letter-spacing:.2em;color:var(--mint)}
.hero .pbar2{position:absolute;left:clamp(26px,4vw,52px);right:clamp(26px,4vw,52px);bottom:clamp(14px,2.6vw,30px);height:4px;background:rgba(20,8,31,.7);z-index:3}
.hero .pbar2 span{display:block;height:100%;width:calc(var(--p) * 100%);background:var(--mint)}
@media (max-width:700px){
  /* phone: video fills the top (as tall as it can be without cropping the pair), title sits underneath */
  .hero .hv{inset:0 0 auto 0;top:0;height:60svh;object-position:calc(72% + var(--p) * 4%) 50%;border-bottom:3px solid var(--mint)}
  .hero.hasvid .hero-in{top:calc(60svh + 16px);left:0;padding-left:22px;max-width:94vw;transform:none;opacity:1}
  .hero.hasvid .htag{font-size:.62rem;padding:6px 9px}
  .hero.hasvid h1{margin-top:8px;font-size:clamp(2.7rem,14.5vw,4.4rem)}
  .hero.hasvid .sub{margin-top:10px;font-size:.66rem;padding:7px 9px;letter-spacing:.2em}
  .hero .tick{display:none}
  .hero .rec{top:24px;bottom:auto;right:auto;left:26px;font-size:.6rem;padding:6px 8px}
  .hero .plates{right:auto;left:26px;top:calc(60svh - 80px);bottom:auto;justify-items:start;gap:6px}
  .hero .pbar2{bottom:12px}
  .hero.hasvid .cue{display:none}
  .hero .kanji{display:none}
}

/* transmission-style story text */
.vscene .txt{left:50%;right:auto;transform:translateX(-50%);width:min(780px,90vw);max-width:none;text-align:center}
.vscene .ch{font-family:"Share Tech Mono",ui-monospace,Menlo,monospace;background:var(--ink);color:var(--mint);border:1px solid var(--mint);border-bottom:0;padding:6px 12px;font-size:.66rem;letter-spacing:.22em}
.vscene .ch::before{display:inline-block;content:"";width:8px;height:8px;margin-right:9px;background:var(--pink);animation:blink 1s steps(2) infinite}
.vscene .lines{background:rgba(20,8,31,.92);border:1px solid var(--mint);border-left:1px solid var(--mint);padding:16px 22px 18px;min-height:3.6em;align-items:center;justify-items:center;box-shadow:0 0 0 3px var(--ink)}
.vscene.vscene .ch{color:var(--mint)}
.vscene .ln{font-family:"Share Tech Mono",ui-monospace,Menlo,monospace;font-weight:400;text-transform:uppercase;letter-spacing:.08em;color:var(--mint);font-size:clamp(.95rem,1.7vw,1.5rem);line-height:1.35;transform:none;transition:opacity .25s;text-align:center}
.vscene .ln{visibility:hidden}.vscene .ln.on{visibility:visible}.vscene .ln.done,.vscene .ln:not(.on){opacity:0;transition:none}
.vscene .ln em{background:none;color:var(--yellow);padding:0}
.vscene .ln::before{content:"> ";color:var(--pink)}
.vscene .ln.typing::after{content:"\2588";margin-left:3px;color:var(--mint);animation:blink .6s steps(2) infinite}
.vscene .ln.on:not(.typing)::after{content:"\2588";margin-left:3px;color:var(--mint);animation:blink 1s steps(2) infinite}
@media (max-width:700px){.vscene .txt{left:0;transform:none;width:auto;right:0;padding:0 14px}.vscene .ln{font-size:clamp(.95rem,4.4vw,1.3rem)}}
.hero .ring{position:absolute;left:50%;top:50%;width:min(90vw,90vh);aspect-ratio:1;margin:calc(min(90vw,90vh) / -2) 0 0 calc(min(90vw,90vh) / -2);border:3px dashed var(--purple);border-radius:50%;transform:rotate(calc(var(--p) * 240deg));opacity:.55}
.hero .ring.b{width:min(62vw,62vh);margin:calc(min(62vw,62vh) / -2) 0 0 calc(min(62vw,62vh) / -2);border-color:var(--mint);transform:rotate(calc(var(--p) * -300deg));border-style:solid;border-width:2px;opacity:.35}
.cue{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);font:600 .8rem/1 var(--display);letter-spacing:.3em;color:var(--white);z-index:3;text-align:center;opacity:clamp(0,calc(1 - var(--p) * 5),1)}
.cue::after{content:"";display:block;width:3px;height:34px;background:var(--yellow);margin:12px auto 0;animation:cue 1.4s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.strip{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--yellow);color:var(--ink);overflow:hidden;display:flex;align-items:center;z-index:2;border-top:4px solid var(--ink)}
.strip div{white-space:nowrap;font:700 1rem/1 var(--display);letter-spacing:.3em;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}

/* beam */
.planet{width:min(86vw,52vh,520px);aspect-ratio:1;position:relative}
.planet svg{width:100%;height:100%;display:block}
.beam-wrap{position:absolute;inset:0;display:grid;justify-items:center;align-content:start}
.beam{position:absolute;top:-30vh;left:50%;width:46px;margin-left:-23px;height:calc(30vh + 50%);background:var(--pink);box-shadow:inset 14px 0 var(--yellow),inset -14px 0 var(--yellow);transform-origin:top;transform:scaleY(clamp(0,calc((var(--p) - .12) * 2.6),1))}
.beam::after{content:"";position:absolute;inset:0 14px;background:var(--white)}
.impact{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;margin:-35% 0 0 -35%;border:6px solid var(--yellow);border-radius:50%;transform:scale(clamp(.01,calc((var(--p) - .5) * 3.2),2.2));opacity:clamp(0,calc((.95 - var(--p)) * 4),1)}
.flash{position:absolute;inset:0;background:var(--yellow);opacity:calc(clamp(0,(var(--p) - .5) * 9,1) * clamp(0,(.7 - var(--p)) * 9,1));pointer-events:none;z-index:2}
.planet.shake{animation:none;transform:translate(calc(clamp(0,(var(--p) - .5) * 6,1) * clamp(0,(.85 - var(--p)) * 6,1) * 8px),0)}

/* collapse */
.split{position:absolute;inset:0}
.split.l{clip-path:polygon(0 0,50% 0,46% 10%,53% 22%,47% 35%,54% 48%,46% 60%,53% 74%,47% 87%,50% 100%,0 100%);transform:translate(calc(var(--e) * -22px),calc(var(--e) * 20px)) rotate(calc(var(--e) * -6deg))}
.split.r{clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%,47% 87%,53% 74%,46% 60%,54% 48%,47% 35%,53% 22%,46% 10%);transform:translate(calc(var(--e) * 190px),calc(var(--e) * -70px)) rotate(calc(var(--e) * 38deg));opacity:calc(1 - var(--e) * .35)}
.collapse{--e:clamp(0,calc((var(--p) - .12) * 1.6),1)}
.debris i{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);background:var(--c);transform:translate(calc(var(--e) * var(--dx) * 1px),calc(var(--e) * var(--dy) * 1px)) rotate(calc(var(--e) * var(--dr) * 1deg));opacity:calc(1 - var(--e) * .3)}

/* invasion */
.sky{position:absolute;inset:0;overflow:hidden}
.ship{position:absolute;top:-14vh;left:var(--x);width:clamp(34px,6vw,70px);transform:translateY(calc(clamp(0,(var(--p) - var(--o)) * 2.2,1) * var(--d) * 1vh))}
.ship svg{width:100%;display:block}

/* chip */

.tr{fill:none;stroke-width:5;stroke-dasharray:420;stroke-dashoffset:calc(420 - clamp(0,(var(--p) - var(--t)) * 3,1) * 420)}
.pulse{position:absolute;inset:0;border:4px solid var(--ink);border-radius:50%;animation:pu 2.4s ease-out infinite;opacity:0}
.pulse:nth-child(2){animation-delay:.8s}.pulse:nth-child(3){animation-delay:1.6s}

/* rebirth */
.reb{width:min(86vw,100%,520px);display:grid;gap:22px;justify-items:center}

.bar{width:100%;border:4px solid var(--ink);height:34px;position:relative;background:var(--mint)}

/* cost */

/* finale */

.fin .big{font-size:min(30vw,34svh);line-height:.95;color:var(--yellow);transform:scale(calc(.7 + clamp(0,var(--p) * 2.2,1) * .3));opacity:clamp(0,calc(var(--p) * 4),1);letter-spacing:.04em}

/* ---------- NFT page ---------- */
.nfthero{position:relative;background:var(--ink);padding:clamp(34px,7vw,80px) clamp(18px,6vw,80px) clamp(40px,7vw,80px);overflow:hidden}

.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}

.trade{position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:34px}.trade span{flex-basis:100%;text-align:center;font:700 .78rem/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}.trade a{font:700 .85rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;background:var(--ink);color:var(--white);padding:13px 18px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}.trade a:hover{background:var(--yellow);color:var(--ink)}

.seg{padding:clamp(40px,7vw,80px) 0 clamp(46px,7vw,90px);position:relative}

.arrows{display:flex;gap:8px}

.deck{display:flex;gap:clamp(14px,2.4vw,28px);overflow-x:auto;scroll-snap-type:x proximity;padding:20px clamp(18px,6vw,80px) 34px;scrollbar-width:none;cursor:grab;-webkit-overflow-scrolling:touch}

.deck.curve .card-w,.deck.curve .fl{transform:translateZ(calc(var(--a,0) * -190px)) rotateY(calc(var(--o,0) * -46deg));opacity:calc(1 - var(--a,0) * .28);will-change:transform}

.card-w{flex:0 0 clamp(210px,58vw,290px);scroll-snap-align:center}

.back{display:inline-block;font:600 .8rem/1 var(--display);letter-spacing:.22em;text-transform:uppercase;text-decoration:none;background:var(--ink);color:var(--yellow);padding:10px 14px;margin-bottom:18px}

.gal{background:var(--purple);color:var(--ink);padding:clamp(40px,7vw,80px) clamp(14px,4vw,60px) clamp(60px,9vw,120px);position:relative;overflow:hidden}

/* ================= light theme: cool grey base, ink panels, vibrant accents ================= */
:root{--bg:#e6e7ec;--bg2:#d6d8e0;--line:rgba(20,8,31,.09)}

.top{background:var(--bg);border-bottom:3px solid var(--ink)}

.nfthero .key{color:var(--white)}
.role{color:var(--ink);background:var(--yellow);display:inline-block;padding:8px 12px}

/* ---------- circuit-board lines ---------- */
function circuit(w,h,n,seed,color,bo,fc){
  var r=seed||1,G=28,out="",i,k;
  function rnd(){r=(r*9301+49297)%233280;return r/233280}
  for(i=0;i<n;i++){
    var x=Math.round(rnd()*w/G)*G,y=Math.round(rnd()*h/G)*G,x0=x,y0=y,d="M"+x+" "+y,sx=rnd()<.5?-1:1,sy=rnd()<.5?-1:1,hz=rnd()<.5;
    for(k=0;k<4;k++){
      var L=(2+Math.floor(rnd()*6))*G,dg=(1+Math.floor(rnd()*2))*G;
      if(hz){x+=sx*L;d+="H"+x}else{y+=sy*L;d+="V"+y}
      x+=sx*dg;y+=sy*dg;d+="L"+x+" "+y;
      hz=!hz;if(rnd()<.4)sy=-sy;if(rnd()<.35)sx=-sx;
    }
    out+='<path d="'+d+'"/>';
    if(i%3===0)out+='<path class="flow" pathLength="100" d="'+d+'" style="animation-delay:-'+(i*1.9).toFixed(1)+'s"/>';
    out+='<circle cx="'+x+'" cy="'+y+'" r="8"/><rect x="'+(x0-5)+'" y="'+(y0-5)+'" width="10" height="10"/>';
  }
  return '<svg class="circ" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="color:'+color+';--bo:'+(bo||.45)+';--fc:'+(fc||"var(--mint)")+'">'+out+'</svg>';
}

/* ---------- curved carousel (NFT cards + gallery), loops forever ---------- */
function makeCurve(d){
  var items=Array.prototype.slice.call(d.children),n=+d.getAttribute("data-n")||items.length,tick=false,down=false,sx=0,sl=0,moved=0,idleT=0,fresh=true;

      it.style.setProperty("--o",o.toFixed(3));it.style.setProperty("--a",Math.abs(o).toFixed(3));it.style.zIndex=Math.max(1,Math.round((1.5-Math.abs(raw))*100));

    });

    if(hm)hm.style.setProperty("--f",(n>1?idx/(n-1):0).toFixed(3));
  }
  function req(){if(!tick){tick=true;requestAnimationFrame(upd)}}
  function centerOf(i){var it=items[i];return it.offsetLeft+it.offsetWidth/2-d.clientWidth/2}

  function wrap(){

    var gapHalf=(items[1].offsetLeft-items[0].offsetLeft-items[0].offsetWidth)/2;
    var start=items[n].offsetLeft-gapHalf,setW=items[2*n].offsetLeft-items[n].offsetLeft;

  window.addEventListener("resize",req);

  d.addEventListener("pointerdown",function(e){if(e.pointerType!=="mouse")return;stopGlide();down=true;moved=0;sx=e.clientX;sl=d.scrollLeft;lx=e.clientX;lt=performance.now();vel=0;d.classList.add("drag")});

  }
  function up(){if(!down)return;down=false;d.classList.remove("drag");if(!reduce&&Math.abs(vel)>.05)glide();else vel=0}
  window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
  d.addEventListener("click",function(e){if(Math.abs(moved)>6){e.stopPropagation();e.preventDefault()}moved=0},true);
  setTimeout(function(){fresh=false},1500);
  $$("img",d).forEach(function(im){if(!im.complete)im.addEventListener("load",function(){if(fresh)d._center(startIdx());upd()})});
  cleanups.push(function(){clearTimeout(idleT);window.removeEventListener("resize",req);window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up)});
  d._center(startIdx());upd();
  setTimeout(function(){if(fresh){d._center(startIdx());upd()}},250);
}

function goEp(n,dir){

}

/* swipe: left/up = next, right/down = previous */
(function(){
  var x0=0,y0=0,t0=0,track=false;
  P.addEventListener("touchstart",function(e){
    if(e.touches.length!==1){track=false;return}
    var t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();
    track=y0<window.innerHeight-76; // keep the video's own control bar usable
  },{passive:true});
  P.addEventListener("touchend",function(e){
    if(!track)return;track=false;
    var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0,ax=Math.abs(dx),ay=Math.abs(dy);

})();

/* lightbox: the piece grows out of its place in the grid (pictures and animations) */
var LB=null;
function fit(g){
  var vw=window.innerWidth,vh=window.innerHeight,mw=vw*.94,mh=vh*.86;
  var ar=g.ar||1;
  var w=Math.min(mw,mh*ar),h=w/ar;
  return {left:(vw-w)/2,top:(vh-h)/2,width:w,height:h};
}
function place(el,r){el.style.left=r.left+"px";el.style.top=r.top+"px";el.style.width=r.width+"px";el.style.height=r.height+"px"}
function makePic(g,from){
  var el;
  if(g.type==="video"){
    el=document.createElement("video");el.muted=true;el.loop=true;el.autoplay=true;el.setAttribute("playsinline","");el.setAttribute("muted","");
    el.poster=g.poster||"";el.src=g.src;
    el.addEventListener("loadedmetadata",function(){try{if(from&&from.currentTime)el.currentTime=from.currentTime}catch(_){}} ,{once:true});
    var p=el.play();if(p&&p.catch)p.catch(function(){});
  }else{el=document.createElement("img");el.src=g.src;el.alt=g.name||""}
  el.className="pic";return el;
}
function openLb(i,src){
  closeLb(true);
  var g=window.GALLERY[i];
  var lb=document.createElement("div");lb.className="lb";lb.setAttribute("role","dialog");lb.setAttribute("aria-label",(g.type==="video"?"Animation ":"Artwork ")+(i+1));
  lb.innerHTML='<button class="x" aria-label="Close">&#10005;</button><button class="lp" aria-label="Previous">&#9664;</button><button class="ln2" aria-label="Next">&#9654;</button>';
  var pic=makePic(g,src);lb.insertBefore(pic,lb.firstChild);
  document.body.appendChild(lb);lockBody(true);
  LB={el:lb,pic:pic,i:i,src:src};
  var r0=src.getBoundingClientRect();place(pic,{left:r0.left,top:r0.top,width:r0.width,height:r0.height});
  src.style.visibility="hidden";
  var started=false,start=function(){if(started)return;started=true;requestAnimationFrame(function(){requestAnimationFrame(function(){if(!LB||LB.el!==lb)return;lb.classList.add("in");place(pic,fit(g))})})};
  if(g.type==="video"||pic.complete)start();else pic.onload=start;
  setTimeout(start,500);
  lb.addEventListener("click",function(e){
    if(e.target.closest(".x")||e.target===lb||e.target===pic)closeLb();
    else if(e.target.closest(".lp"))stepLb(-1);
    else if(e.target.closest(".ln2"))stepLb(1);
  });
}
function stepLb(d){
  if(!LB)return;
  var G=window.GALLERY,n=G.length,tiles=$$("#cg .gt"),i=(LB.i+d+n)%n,t=tiles[i];if(!t)return;
  var media=t.querySelector("img,video"),old=LB.pic,lb=LB.el;
  try{t.scrollIntoView({block:"center"})}catch(_){}
  LB.src.style.visibility="";LB.src=media;media.style.visibility="hidden";LB.i=i;
  old.style.opacity="0";
  setTimeout(function(){
    if(!LB||LB.el!==lb)return;
    var pic=makePic(G[i],media);pic.style.opacity="0";pic.style.transition="opacity .18s";
    if(old.parentNode)old.parentNode.removeChild(old);
    lb.insertBefore(pic,lb.firstChild);LB.pic=pic;place(pic,fit(G[i]));
    requestAnimationFrame(function(){pic.style.opacity="1"});
  },170);
}
function closeLb(instant){
  if(!LB)return;var lb=LB.el,src=LB.src,pic=LB.pic;LB=null;
  lockBody(!!playerOpen);
  function done(){if(src)src.style.visibility="";if(lb.parentNode)lb.parentNode.removeChild(lb)}
  if(instant===true||!src||!document.body.contains(src)){done();return}
  var r=src.getBoundingClientRect();lb.classList.remove("in");pic.style.transition="";place(pic,r);
  setTimeout(done,400);
}
document.addEventListener("keydown",function(e){
  if(!LB)return;
  if(e.key==="Escape")closeLb();else if(e.key==="ArrowRight")stepLb(1);else if(e.key==="ArrowLeft")stepLb(-1);
});
window.addEventListener("resize",function(){if(LB&&LB.pic)place(LB.pic,fit(window.GALLERY[LB.i]))});
